<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="bootsrap.min.js">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <title>Practica 1: Interfaces Web</title>
</head>
<body>
    <div class="container-fluid">
        <header class="row">
            <nav class="navbar navbar-expand-lg bg-dark col-12 align-self-center">
                <div class="row col-1 m-0 p-0">
                    <a class="navbar-brand text-light text-center" href="index.html">DASW</a>
                </div>
                <div class="row col-11 m-0 p-0">
                    <div class="collapse navbar-collapse">
                        <form class="d-flex col-6" role="search">
                            <input class="form-control me-0" type="text" placeholder="Encuentra de todo empieza a buscar">
                            <button class="btn btn-outline-light my-2 my-sm-0" type="submit">Search</button>
                        </form>
                        <div class="container text-center">
                            <div class="row justify-content-end">
                                <div class="col-3 m-0 p-0">
                                    <ul class="navbar-nav">
                                        <li class="nav-item dropdown">
                                            <a class="nav-link dropdown-toggle text-light" href="#" role="button" data-bs-toggle="dropdown"
                                                aria-expanded="false">Mi Cuenta</a>
                                            <div class="dropdown-menu">
                                                <button class="dropdown-item" data-bs-toggle="modal" data-bs-target="#ingresarModal">Ingresar</button>
                                                <button class="dropdown-item" data-bs-toggle="modal" data-bs-target="#registroModal">Registro</button>
                                                <hr class="dropdown-divider">
                                                <a class="dropdown-item" href="cart.html">Mis pedidos</a>
                                            </div>
                                        </li>
                                        <li class="nav-item">
                                            <a href="#">
                                                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor"
                                                    class="bi bi-cart3 text-light" viewBox="0 0 16 16">
                                                    <path d="M0 1.5A.5.5 0 0 1 .5 1H2a.5.5 0 0 1 .485.379L2.89 3H14.5a.5.5 0 0 1 .49.598l-1
                                                        5a.5.5 0 0 1-.465.401l-9.397.472L4.415 11H13a.5.5 0 0 1 0 1H4a.5.5 0 0 1-.491-.408L2.01
                                                        3.607 1.61 2H.5a.5.5 0 0 1-.5-.5M3.102 4l.84 4.479 9.144-.459L13.89 4zM5 12a2 2 0 1 0 0
                                                        4 2 2 0 0 0 0-4m7 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4m-7 1a1 1 0 1 1 0 2 1 1 0 0 1 0-2m7 0a1
                                                        1 0 1 1 0 2 1 1 0 0 1 0-2"/>
                                                </svg>
                                            </a>
                                        </li>
                                    </ul>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </nav>
        </header>
        <main class="row">
            <div class="container text-center mt-4">
                <h1>Resumen de compra</h1>
            </div>
            <div class="container mt-5">
                <div class="row col-6 ms-5">
                    <div class="row justify-content-center ms-5">
                        <div class="card col-12" style="width: 100%;">
                            <div class="card-body col-5">
                            </div>
                            <div class="card-body col-5">
                                <img src="public/img/strawberry.jpg" class="card-img-top my-3" alt="strawberry" style="width: 40%;">
                            </div>
                        </div>
                    </div>
                </div>
                <div class="row">
                </div>
            </div>
        </main>
    </div>
    <footer></footer>
    <div class="modal fade" id="ingresarModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h1 class="modal-title fs-5" id="exampleModalLabel">Ingresar</h1>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="m-0 p-0 mb-2">
                    <label for="email">Correo</label>
                </div>
                <div class="input-group mb-3">
                    <input type="text" class="form-control" placeholder="Ingresa tu correo" name="email" id="email" aria-label="Username" aria-describedby="basic-addon1">
                    <span class="input-group-text" id="basic-addon1">
                        <il class="bi bi-person-fill"></il>
                    </span>
                </div>
                <div class="m-0 p-0 mb-2">
                    <label for="password">Contraseña</label>
                </div>
                <div class="input-group mb-3">
                    <input type="password" class="form-control" placeholder="Ingresa tu contraseña" name="password" id="password" aria-label="Password" aria-describedby="basic-addon2" required="">
                    <span class="input-group-text" id="basic-addon2">
                        <il class="bi bi-key-fill"></il>
                    </span>
                </div>
                <div class="d-grid gap-2 col-6 mx-auto">
                    <button type="button" class="btn btn-success">Log in</button>
                </div>
            </div>
            <div class="modal-footer">
                <p>¿No tienes cuenta? <button type="button" class="btn" data-bs-toggle="modal" data-bs-target="#registroModal">Regístrate aquí</button></p>
            </div>
          </div>
        </div>
    </div>
    <div class="modal fade" id="registroModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h1 class="modal-title fs-5" id="exampleModalLabel">Ingresar</h1>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="row input-group mb-3">
                    <div class="col">
                        <input type="text" class="form-control" placeholder="Nombre(s)" aria-label="First name">
                    </div>
                    <div class="col">
                        <input type="text" class="form-control" placeholder="Apellidos" aria-label="Last name">
                    </div>
                </div>
                <div class="input-group mb-3">
                    <input type="text" class="form-control" placeholder="Correo" aria-label="Email">
                </div>
                <div class="input-group mb-3">
                    <input type="password" class="form-control" placeholder="Ingresa tu contraseña" name="password" id="password" aria-label="Password" aria-describedby="basic-addon2" required="">
                </div>
                <div class="input-group mb-3">
                    <input type="password" class="form-control" placeholder="Confirmar contraseña" name="password" id="password" aria-label="Password" aria-describedby="basic-addon2" required="">
                </div>
                <div class="d-grid gap-2 col-6 mx-auto">
                    <button type="button" class="btn btn-success">Sign in</button>
                </div>
            </div>
            <div class="modal-footer">
                <p>¿Ya tienes cuenta? <button type="button" class="btn" data-bs-toggle="modal" data-bs-target="#ingresarModal">Inicia sesión aquí</button></p>
            </div>
          </div>
        </div>
    </div>

    <script type="text/javascript" src="bootstrap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
